<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>For Petronella ❤️</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
height:100vh;
overflow:hidden;
background:linear-gradient(to bottom,#050816,#0b1636,#02040a);
display:flex;
justify-content:center;
align-items:center;
color:white;
}

canvas{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-2;
}

.glow{
position:fixed;
width:500px;
height:500px;
background:#7b61ff55;
filter:blur(140px);
top:-100px;
left:-100px;
z-index:-1;
animation:move 10s ease infinite alternate;
}

@keyframes move{
to{
transform:translate(250px,180px);
}
}

.card{
width:90%;
max-width:700px;
padding:35px;
border-radius:30px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.15);
text-align:center;
box-shadow:0 20px 60px rgba(0,0,0,.4);
animation:fade 2s;
}

@keyframes fade{
from{opacity:0;transform:translateY(30px)}
to{opacity:1;transform:none}
}

h1{
font-size:40px;
margin-bottom:20px;
}

#text{
font-size:20px;
line-height:1.8;
min-height:220px;
white-space:pre-line;
}

button{
margin-top:20px;
padding:15px 35px;
border:none;
border-radius:50px;
font-size:18px;
cursor:pointer;
transition:.3s;
}

#yes{
background:#ff4f81;
color:white;
}

#yes:hover{
transform:scale(1.08);
}

#no{
background:white;
color:#111;
position:absolute;
}

#final{
display:none;
font-size:22px;
line-height:2;
animation:fade 1s;
}

.heart{
position:fixed;
font-size:20px;
animation:float 5s linear forwards;
pointer-events:none;
}

@keyframes float{
0%{transform:translateY(0);opacity:1}
100%{transform:translateY(-120vh);opacity:0}
}
</style>
</head>

<body>

<canvas id="stars"></canvas>

<div class="glow"></div>

<div class="card">

<h1>❤️ Dear Petronella ❤️</h1>

<div id="text"></div>

<div id="buttons">
<button id="yes">Yes, Forever ❤️</button>
<button id="no">No 🙈</button>
</div>

<div id="final">
<h2>❤️ YOU SAID YES ❤️</h2>

<p>
You just made me the happiest man alive.
<br><br>

Thank you for choosing us.
<br><br>

I promise to choose you every single day.
<br><br>

<b>Forever Yours,<br>Ken ❤️</b>
</p>

</div>

</div>

<script>

const message=`Some people spend their whole lives searching
for someone who feels like home.

I didn't know I was searching...

Until I met you.

Every smile,
every conversation,
every moment...

made me realise that
you are someone incredibly special.

I don't promise perfection.

But I promise honesty.

Loyalty.

Respect.

Patience.

And choosing you...

Every single day.

So...

Petronella...

Will you be my girlfriend? ❤️`;

let i=0;

function type(){
if(i<message.length){
document.getElementById("text").innerHTML+=message.charAt(i);
i++;
setTimeout(type,35);
}
}

type();

const no=document.getElementById("no");

no.onmouseover=()=>{
no.style.left=Math.random()*(window.innerWidth-150)+"px";
no.style.top=Math.random()*(window.innerHeight-80)+"px";
};

document.getElementById("yes").onclick=()=>{

document.getElementById("text").style.display="none";
document.getElementById("buttons").style.display="none";
document.getElementById("final").style.display="block";

setInterval(()=>{
const h=document.createElement("div");
h.className="heart";
h.innerHTML="❤️";
h.style.left=Math.random()*100+"vw";
h.style.bottom="-20px";
h.style.fontSize=(20+Math.random()*25)+"px";
document.body.appendChild(h);
setTimeout(()=>h.remove(),5000);
},150);

};

const canvas=document.getElementById("stars");
const ctx=canvas.getContext("2d");

canvas.width=innerWidth;
canvas.height=innerHeight;

let stars=[];

for(let i=0;i<180;i++){
stars.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:Math.random()*2,
v:Math.random()*0.5
});
}

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="white";

stars.forEach(s=>{

ctx.beginPath();

ctx.arc(s.x,s.y,s.r,0,Math.PI*2);

ctx.fill();

s.y+=s.v;

if(s.y>canvas.height)s.y=0;

});

requestAnimationFrame(draw);

}

draw();

window.onresize=()=>{
canvas.width=innerWidth;
canvas.height=innerHeight;
}

</script>

</body>
</html>
